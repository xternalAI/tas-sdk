name: CI

# Everything here runs offline: no secrets, no vendor accounts. Actions are pinned to exact commits
# (Dependabot proposes updates), so a moved tag upstream cannot change what runs here. The live tests
# (pnpm test:live) create real things on real platforms and are run by hand.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing in this job pushes; do not leave a token on disk for PR code
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm coverage
      # Coverage is the same on every Node version; report it once.
      - name: Coverage summary
        if: ${{ !cancelled() && matrix.node == '26' }}
        run: node scripts/coverage-report.ts >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: ${{ !cancelled() && matrix.node == '26' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage
          retention-days: 30
      - run: pnpm build
      # The package as npm would ship it: packed, installed into an empty project, imported and run.
      - run: node scripts/smoke-package.ts

  # Keeps the README's coverage badge current: the badge is one SVG file on a branch of its own,
  # so no coverage service, account or token is involved.
  badge:
    name: Coverage badge
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-report
          path: coverage
      - name: Publish to the badges branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir out && cp coverage/badge.svg out/coverage.svg && cd out
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coverage.svg
          git commit -q -m "Coverage badge for ${GITHUB_SHA}"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
